<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#111827"><title>ASRA AI</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#fff;color:#111827}body{overflow:hidden}button,input,textarea{font:inherit}button{cursor:pointer}.app{height:100vh;display:flex;flex-direction:column}.topbar{height:58px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 12px}.brand{font-size:20px;font-weight:700}.top-actions{display:flex;gap:6px;align-items:center}.icon-btn{border:0;background:transparent;width:40px;height:40px;border-radius:10px;font-size:20px}.icon-btn:hover{background:#f3f4f6}.avatar{width:34px;height:34px;border:0;border-radius:50%;background:#111827;color:#fff;font-weight:700}.main{flex:1;min-height:0;display:flex}.sidebar{width:280px;border-right:1px solid #e5e7eb;background:#fafafa;padding:12px;display:flex;flex-direction:column}.new-chat{width:100%;border:1px solid #d1d5db;background:#fff;border-radius:11px;padding:11px;text-align:left;font-weight:600}.history-title{font-size:12px;color:#6b7280;margin:18px 6px 8px}.history{overflow:auto;flex:1}.history-item{padding:10px;border-radius:9px;margin-bottom:3px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history-item:hover{background:#e5e7eb}.sidebar-bottom{font-size:12px;color:#6b7280;padding:8px 4px}.chat-area{flex:1;min-width:0;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:24px 16px 130px}.welcome{max-width:760px;margin:12vh auto 0;text-align:center;padding:20px}.logo{font-size:42px;font-weight:800;margin-bottom:8px}.welcome h1{margin:0 0 8px;font-size:30px}.welcome p{color:#6b7280;margin:0}.message{max-width:850px;margin:0 auto 22px;display:flex;gap:11px}.message.user{justify-content:flex-end}.bubble{max-width:78%;padding:11px 14px;border-radius:15px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.message.user .bubble{background:#111827;color:#fff;border-bottom-right-radius:5px}.message.assistant .bubble{background:#f3f4f6;border-bottom-left-radius:5px}.mini-avatar{width:30px;height:30px;min-width:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:#111827;color:#fff}.composer-wrap{position:absolute;bottom:0;left:280px;right:0;padding:12px 14px 15px;background:linear-gradient(transparent,#fff 28%);pointer-events:none}.composer{max-width:850px;margin:auto;border:1px solid #d1d5db;border-radius:17px;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.07);padding:8px;pointer-events:auto}.textarea-row{display:flex;align-items:flex-end;gap:7px}textarea{resize:none;border:0;outline:0;flex:1;min-height:44px;max-height:150px;padding:10px 8px;background:transparent}.circle-btn{width:40px;height:40px;border-radius:11px;border:0;background:#f3f4f6;font-size:19px}.send{background:#111827;color:#fff}.composer-tools{display:flex;gap:5px;padding:3px 2px 1px}.tool-btn{border:0;background:transparent;border-radius:8px;padding:7px 9px;font-size:13px;color:#374151}.tool-btn:hover{background:#f3f4f6}.plus-menu{position:absolute;bottom:76px;left:8px;width:245px;background:#fff;border:1px solid #e5e7eb;border-radius:13px;box-shadow:0 12px 35px rgba(0,0,0,.15);padding:7px;display:none}.plus-menu.show{display:block}.menu-item{width:100%;display:flex;gap:11px;border:0;background:#fff;padding:11px;border-radius:9px;text-align:left}.menu-item:hover{background:#f3f4f6}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15;display:none;align-items:center;justify-content:center;padding:18px}.overlay.show{display:flex}.modal{width:100%;max-width:390px;background:#fff;border-radius:18px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.modal h2{margin:0 0 5px}.modal p{margin:0 0 18px;color:#6b7280;font-size:14px}.field{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:12px;margin:7px 0;outline:0}.primary{width:100%;border:0;background:#111827;color:#fff;border-radius:10px;padding:12px;margin-top:7px;font-weight:700}.secondary{width:100%;border:1px solid #d1d5db;background:#fff;border-radius:10px;padding:11px;margin-top:8px}.switch{border:0;background:transparent;color:#2563eb;margin-top:13px;font-size:13px}.status{font-size:13px;min-height:18px;margin-top:8px;color:#b91c1c}.hidden{display:none!important}.file-input{display:none}@media(max-width:700px){.sidebar{display:none}.composer-wrap{left:0}.messages{padding:20px 10px 125px}.bubble{max-width:88%}.welcome{margin-top:12vh}.welcome h1{font-size:25px}.logo{font-size:34px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><button class="icon-btn" id="sidebarToggle">☰</button><div class="brand">ASRA AI</div><div class="top-actions"><button class="icon-btn" id="newTop">✚</button><button class="avatar" id="avatarBtn">A</button></div></header>
<div class="main"><aside class="sidebar" id="sidebar"><button class="new-chat" id="newChat">＋ New chat</button><div class="history-title">CHAT HISTORY</div><div class="history" id="history"></div><div class="sidebar-bottom" id="loginState">Not signed in</div></aside><section class="chat-area"><div class="messages" id="messages"><div class="welcome" id="welcome"><div class="logo">ASRA AI</div><h1>How can I help you?</h1><p>Sign in to save your chats.</p></div></div></section></div>
<div class="composer-wrap"><div class="composer"><div class="textarea-row"><button class="circle-btn" id="plusBtn">＋</button><textarea id="prompt" rows="1" placeholder="Message ASRA AI..."></textarea><button class="circle-btn" id="micBtn">🎙️</button><button class="circle-btn send" id="sendBtn">➤</button></div><div class="composer-tools"><button class="tool-btn" id="attachBtn">📎 File</button><button class="tool-btn" id="thinkBtn">🧠 Thinking</button><button class="tool-btn" id="writeBtn">✍️ Writing</button></div><div class="plus-menu" id="plusMenu"><button class="menu-item" id="photoBtn">🖼️ &nbsp; Photo</button><button class="menu-item" id="videoBtn">🎬 &nbsp; Video</button><button class="menu-item" id="fileBtn">📄 &nbsp; File</button><button class="menu-item" id="musicBtn">🎵 &nbsp; Music</button><button class="menu-item" id="thinkMenuBtn">🧠 &nbsp; Thinking</button><button class="menu-item" id="writeMenuBtn">✍️ &nbsp; Writing</button></div></div></div>
</div>
<input type="file" id="fileInput" class="file-input" multiple><input type="file" id="photoInput" class="file-input" accept="image/*"><input type="file" id="videoInput" class="file-input" accept="video/*"><input type="file" id="musicInput" class="file-input" accept="audio/*">
<div class="overlay" id="authOverlay"><div class="modal"><h2 id="authTitle">Sign in to ASRA AI</h2><p id="authDesc">Use your email and password.</p><input class="field hidden" id="nameInput" placeholder="Your name"><input class="field" id="emailInput" type="email" placeholder="Email"><input class="field" id="passwordInput" type="password" placeholder="Password"><button class="primary" id="authAction">Sign In</button><button class="switch" id="modeSwitch">Create a new account</button><button class="switch" id="forgotBtn">Forgot password?</button><button class="secondary" id="closeAuth">Close</button><div class="status" id="authStatus"></div></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,sendPasswordResetEmail,updateProfile}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import{getFirestore,collection,addDoc,query,where,orderBy,getDocs,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBqO8-fNNLP2ChjdXbh1oQtd-sHuRRGp4E",authDomain:"asra-ai-36821.firebaseapp.com",projectId:"asra-ai-36821",storageBucket:"asra-ai-36821.firebasestorage.app",messagingSenderId:"847023634119",appId:"1:847023634119:web:ae86fe8ea8610a024b30e2",measurementId:"G-E0RW3SKYY7"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);const $=id=>document.getElementById(id);let currentUser=null,isRegister=false,currentMessages=[];const messages=$('messages'),prompt=$('prompt'),menu=$('plusMenu');
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
function showAuth(reg=false){isRegister=reg;$('authOverlay').classList.add('show');$('authTitle').textContent=reg?'Create ASRA AI account':'Sign in to ASRA AI';$('authDesc').textContent=reg?'Create an account to save your chats.':'Use your email and password.';$('nameInput').classList.toggle('hidden',!reg);$('authAction').textContent=reg?'Create Account':'Sign In';$('modeSwitch').textContent=reg?'Already have an account? Sign in':'Create a new account';$('forgotBtn').classList.toggle('hidden',reg);$('authStatus').textContent=''}
function err(e){return({'auth/invalid-credential':'Email or password is incorrect.','auth/invalid-email':'Please enter a valid email address.','auth/email-already-in-use':'This email is already registered.','auth/weak-password':'Password should be at least 6 characters.','auth/network-request-failed':'Network connection failed.','auth/too-many-requests':'Too many attempts. Please wait.'}[e?.code]||e?.message||'Something went wrong.')}
async function authAction(){let email=$('emailInput').value.trim(),pass=$('passwordInput').value,name=$('nameInput').value.trim();if(!email||!pass||(isRegister&&!name))return $('authStatus').textContent='Please fill in all required fields.';$('authStatus').textContent='Please wait...';try{if(isRegister){let c=await createUserWithEmailAndPassword(auth,email,pass);if(name)await updateProfile(c.user,{displayName:name});try{await addDoc(collection(db,'users'),{uid:c.user.uid,name,email,createdAt:serverTimestamp()})}catch(e){console.warn(e)}}else await signInWithEmailAndPassword(auth,email,pass);$('authOverlay').classList.remove('show')}catch(e){$('authStatus').textContent=err(e)}}
async function reset(){let email=$('emailInput').value.trim();if(!email)return $('authStatus').textContent='Enter your email first.';try{await sendPasswordResetEmail(auth,email);$('authStatus').textContent='Password reset email sent.'}catch(e){$('authStatus').textContent=err(e)}}
function add(role,text){$('welcome')?.remove();let r=document.createElement('div');r.className='message '+role;r.innerHTML=role==='assistant'?'<div class="mini-avatar">AI</div><div class="bubble">'+esc(text)+'</div>':'<div class="bubble">'+esc(text)+'</div>';messages.appendChild(r);messages.scrollTop=messages.scrollHeight}
function reply(t){let x=t.toLowerCase();if(x.includes('hello')||x.includes('hi')||x.includes('হ্যালো')||x.includes('হাই'))return'Hello! আমি ASRA AI। Firebase login ও chat history এখন সংযুক্ত আছে। Real AI response চালু করতে secure AI backend/API পরের ধাপে যুক্ত করতে হবে।';return'আমি তোমার বার্তাটি পেয়েছি। এই version-এ Firebase login ও chat storage কাজ করছে। Real AI উত্তর, image generation এবং video generation চালু করতে secure backend/API যুক্ত করতে হবে।'}
async function save(){if(!currentUser||!currentMessages.length)return;try{await addDoc(collection(db,'chats'),{uid:currentUser.uid,messages:currentMessages,title:currentMessages.find(x=>x.role==='user')?.text?.slice(0,60)||'New chat',createdAt:serverTimestamp()})}catch(e){console.warn('Chat save failed:',e)}}
async function send(){let t=prompt.value.trim();if(!t)return;if(!currentUser)return showAuth(false);prompt.value='';prompt.style.height='44px';currentMessages.push({role:'user',text:t});add('user',t);let r=reply(t);currentMessages.push({role:'assistant',text:r});add('assistant',r);await save()}
async function history(){let h=$('history');h.innerHTML='';if(!currentUser)return;try{let q=query(collection(db,'chats'),where('uid','==',currentUser.uid),orderBy('createdAt','desc')),s=await getDocs(q);s.forEach(d=>{let x=document.createElement('div');x.className='history-item';x.textContent=d.data().title||'New chat';x.onclick=()=>openChat(d.data().messages||[]);h.appendChild(x)})}catch(e){let x=document.createElement('div');x.className='history-item';x.textContent='No history yet';h.appendChild(x)}}
function openChat(ms){messages.innerHTML='';currentMessages=ms;ms.forEach(m=>add(m.role,m.text))}
function newChat(){messages.innerHTML='<div class="welcome" id="welcome"><div class="logo">ASRA AI</div><h1>How can I help you?</h1><p>Start a new conversation.</p></div>';currentMessages=[]}
function tool(label){add('assistant',label+' selected. এই UI action প্রস্তুত আছে। Real AI/media processing backend ধাপে যুক্ত হবে।');menu.classList.remove('show')}
onAuthStateChanged(auth,async u=>{currentUser=u;if(u){$('avatarBtn').textContent=(u.displayName||u.email||'A')[0].toUpperCase();$('loginState').textContent='Signed in: '+(u.displayName||u.email);await history()}else{$('avatarBtn').textContent='A';$('loginState').textContent='Not signed in';$('history').innerHTML=''}});
$('authAction').onclick=authAction;$('modeSwitch').onclick=()=>showAuth(!isRegister);$('forgotBtn').onclick=reset;$('closeAuth').onclick=()=>$('authOverlay').classList.remove('show');$('avatarBtn').onclick=()=>currentUser?(confirm('Sign out from ASRA AI?')&&signOut(auth)):showAuth(false);$('sendBtn').onclick=send;$('newChat').onclick=newChat;$('newTop').onclick=newChat;$('plusBtn').onclick=e=>{e.stopPropagation();menu.classList.toggle('show')};document.onclick=e=>{if(!menu.contains(e.target)&&e.target!==$('plusBtn'))menu.classList.remove('show')};
prompt.oninput=()=>{prompt.style.height='44px';prompt.style.height=Math.min(prompt.scrollHeight,150)+'px'};prompt.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
$('sidebarToggle').onclick=()=>{$('sidebar').style.display=$('sidebar').style.display==='none'?'':'none'};
$('thinkBtn').onclick=()=>tool('Thinking mode');$('writeBtn').onclick=()=>tool('Writing mode');$('thinkMenuBtn').onclick=()=>tool('Thinking mode');$('writeMenuBtn').onclick=()=>tool('Writing mode');
function choose(id,label){$(id).onchange=()=>{if($(id).files.length)add('assistant',label+' selected: '+[...$(id).files].map(f=>f.name).join(', '));$(id).value='';menu.classList.remove('show')}}
$('attachBtn').onclick=()=>$('fileInput').click();$('fileBtn').onclick=()=>$('fileInput').click();$('photoBtn').onclick=()=>$('photoInput').click();$('videoBtn').onclick=()=>$('videoInput').click();$('musicBtn').onclick=()=>$('musicInput').click();choose('fileInput','File');choose('photoInput','Photo');choose('videoInput','Video');choose('musicInput','Music');
$('micBtn').onclick=()=>{let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert('Voice input is not supported by this browser.');let r=new R();r.lang='bn-BD';r.onresult=e=>{prompt.value=e.results[0][0].transcript;prompt.dispatchEvent(new Event('input'))};r.start()};
</script></body></html>
