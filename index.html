<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASRA AI</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#fff;color:#171717}.app{display:flex;height:100vh}.side{width:260px;background:#f7f7f8;padding:14px;border-right:1px solid #ddd}.brand{font-size:21px;font-weight:800;padding:12px}.new{width:100%;padding:12px;background:#fff;border:1px solid #ddd;border-radius:10px}.hist{margin-top:20px;color:#666;font-size:13px}.row{padding:9px;border-radius:8px;white-space:nowrap;overflow:hidden}.row:hover{background:#eee}.main{flex:1;display:flex;flex-direction:column;position:relative}.top{height:58px;border-bottom:1px solid #ddd;padding:15px;font-weight:700}.user{float:right;font-size:12px;color:#777;font-weight:400}.msgs{flex:1;overflow:auto;padding:25px 15px 150px}.welcome{text-align:center;margin:12vh auto;max-width:700px}.msg{max-width:850px;margin:0 auto 20px;display:flex;gap:10px}.av{width:30px;height:30px;border-radius:9px;background:#111;color:#fff;display:grid;place-items:center;flex:none}.userMsg .av{background:#ddd;color:#111}.bubble{white-space:pre-wrap;line-height:1.6}.userMsg .bubble{background:#f2f2f2;padding:9px 13px;border-radius:15px}.composer{position:absolute;bottom:0;left:0;right:0;padding:15px;background:linear-gradient(transparent,#fff 25%)}.box{max-width:850px;margin:auto;border:1px solid #ccc;border-radius:18px;padding:8px}.input{width:100%;border:0;outline:0;resize:none;padding:10px;background:transparent}.tools{display:flex;gap:7px}.btn{border:0;border-radius:50%;width:38px;height:38px;background:#eee}.send{margin-left:auto;background:#111;color:#fff}.plus{position:absolute;bottom:80px;left:calc(50% - 425px);width:260px;background:#fff;border:1px solid #ddd;border-radius:15px;padding:8px;box-shadow:0 10px 30px #0002;display:none}.plus.open{display:block}.item{padding:11px;border-radius:9px}.item:hover{background:#f1f1f1}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:15px;z-index:20}.modal.open{display:grid}.card{background:#fff;width:100%;max-width:430px;padding:20px;border-radius:16px}.card input,.card textarea,.card select{width:100%;padding:11px;margin-top:6px;border:1px solid #ccc;border-radius:9px}.primary{width:100%;padding:11px;background:#111;color:#fff;border:0;border-radius:9px;margin-top:14px}.secondary{width:100%;padding:10px;background:#eee;border:0;border-radius:9px;margin-top:8px}.err{color:#c00;font-size:13px;margin-top:8px}.studio{display:none;position:absolute;inset:58px 0 0;background:#fff;overflow:auto;padding:25px}.studio.open{display:block}.grid{max-width:1000px;margin:auto;display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.panel{border:1px solid #ddd;border-radius:15px;padding:16px}.panel textarea{min-height:150px;resize:vertical}.panel>*{margin-bottom:12px}.preview{aspect-ratio:16/9;background:#111;color:#aaa;display:grid;place-items:center;border-radius:10px;text-align:center}.close{float:right;padding:8px;border:1px solid #ddd;background:#fff;border-radius:8px}@media(max-width:700px){.side{display:none}.plus{left:10px}.grid{grid-template-columns:1fr}.studio{padding:15px}} </style></head><body><div class="app"><aside class="side"><div class="brand">◈ ASRA AI</div><button class="new" onclick="newChat()">＋ New chat</button><div class="hist">MY CHATS<div id="history"></div></div><hr><div onclick="logout()">🚪 Logout</div></aside><main class="main"><header class="top">ASRA AI <span class="user" id="user"></span></header><section class="msgs" id="msgs"><div class="welcome" id="welcome"><h1>What can I help with?</h1><p>Chat, files, image and video studio.</p></div></section><div class="composer"><div class="plus" id="plus"><div class="item" onclick="upload('photo')">📷 Photo</div><div class="item" onclick="openStudio()">🎬 Video</div><div class="item" onclick="upload('file')">📁 File</div><div class="item" onclick="alert('Music will be connected next.')">🎵 Music</div><div class="item" onclick="setMode('thinking')">🧠 Thinking</div><div class="item" onclick="setMode('writing')">✍️ Writing</div></div><div class="box"><textarea id="input" class="input" rows="1" placeholder="Message ASRA AI..." onkeydown="key(event)"></textarea><div class="tools"><button class="btn" onclick="togglePlus()">＋</button><span id="mode"></span><button class="btn" onclick="voice()">🎙️</button><button class="btn send" onclick="send()">↑</button></div></div></div></main></div><div class="studio" id="studio"><button class="close" onclick="closeStudio()">✕ Close</button><h2>🎬 AI Video Studio</h2><div class="grid"><div class="panel"><label>Video prompt</label><textarea id="vp" placeholder="Describe your video..."></textarea><label>Aspect ratio<select id="ratio"><option>16:9</option><option>9:16</option><option>1:1</option><option>4:5</option></select></label><label>Quality<select id="quality"><option>720p</option><option>1080p</option><option>4K</option></select></label><label>Duration<select id="duration"><option>5 seconds</option><option>10 seconds</option><option>15 seconds</option><option>30 seconds</option></select></label><button class="primary" onclick="generate()">✨ Generate Video</button><div id="status">Real video API will be connected next.</div></div><div class="panel"><h3>Preview</h3><div class="preview">🎞️<br>Video preview</div></div></div></div><div class="modal open" id="auth"><div class="card"><h2 id="at">ASRA AI Login</h2><label>Email<input id="email" type="email"></label><label>Password<input id="pass" type="password"></label><div class="err" id="err"></div><button class="primary" onclick="authAction()" id="ab">Login</button><button class="secondary" onclick="resetPass()">Forgot password</button><p style="text-align:center;font-size:13px"><span id="sw">Account নেই?</span> <u onclick="toggleAuth()" id="link">Register</u></p></div></div><div class="modal" id="upload"><div class="card"><h2>Upload</h2><input id="file" type="file"><button class="primary" onclick="useFile()">Continue</button><button class="secondary" onclick="closeUpload()">Cancel</button></div></div><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";import{getFirestore,collection,addDoc,query,where,orderBy,getDocs,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBqO8-fNNLP2ChjdXbh1oQtd-sHuRRGp4E",authDomain:"asra-ai-36821.firebaseapp.com",projectId:"asra-ai-36821",storageBucket:"asra-ai-36821.firebasestorage.app",messagingSenderId:"847023634119",appId:"1:847023634119:web:ae86fe8ea8610a024b30e2",measurementId:"G-E0RW3SKYY7"};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let user=null,register=false,mode="",chat=[];const $=x=>document.getElementById(x);
window.toggleAuth=()=>{register=!register;$('at').textContent=register?'Create ASRA AI Account':'ASRA AI Login';$('ab').textContent=register?'Register':'Login';$('sw').textContent=register?'আগে থেকেই account আছে?':'Account নেই?';$('link').textContent=register?'Login':'Register';$('err').textContent=''};
window.authAction=async()=>{let e=$('email').value.trim(),p=$('pass').value;if(!e||!p){$('err').textContent='Email ও password দিন';return}try{if(register)await createUserWithEmailAndPassword(auth,e,p);else await signInWithEmailAndPassword(auth,e,p)}catch(x){$('err').textContent=x.code||'Login error'}};
window.resetPass=async()=>{let e=$('email').value.trim();if(!e){$('err').textContent='Email লিখুন';return}try{await sendPasswordResetEmail(auth,e);alert('Password reset email পাঠানো হয়েছে')}catch(x){$('err').textContent=x.code}};
onAuthStateChanged(auth,async u=>{user=u;if(u){$('auth').classList.remove('open');$('user').textContent=u.email;await loadHistory()}else $('auth').classList.add('open')});
async function loadHistory(){try{let q=query(collection(db,'chats'),where('uid','==',user.uid),orderBy('createdAt','desc'));let s=await getDocs(q);$('history').innerHTML='';s.forEach(d=>{let m=d.data().messages?.[0]?.content;if(m){let x=document.createElement('div');x.className='row';x.textContent=m;$('history').appendChild(x)}})}catch(e){console.log(e)}}
function add(w,t){$('welcome')?.remove();let d=document.createElement('div');d.className='msg '+(w==='user'?'userMsg':'');d.innerHTML='<div class="av">'+(w==='user'?'U':'A')+'</div><div class="bubble"></div>';d.querySelector('.bubble').textContent=t;$('msgs').appendChild(d);$('msgs').scrollTop=$('msgs').scrollHeight}
window.send=async()=>{if(!user)return;let p=$('input').value.trim();if(!p)return;add('user',p);$('input').value='';chat.push({role:'user',content:p});setTimeout(async()=>{let r=mode==='thinking'?'Thinking mode প্রস্তুত। Real AI API পরের ধাপে যুক্ত হবে।':mode==='writing'?'Writing mode প্রস্তুত। Real AI API পরের ধাপে যুক্ত হবে।':'Firebase login এবং chat database সফলভাবে কাজ করছে। এখন Real Chat AI API যুক্ত করব।';add('assistant',r);chat.push({role:'assistant',content:r});try{await addDoc(collection(db,'chats'),{uid:user.uid,messages:chat.slice(-20),createdAt:serverTimestamp()});await loadHistory()}catch(e){console.log(e)}},350)};
window.key=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};window.togglePlus=()=>{$('plus').classList.toggle('open')};window.setMode=m=>{mode=m;$('mode').textContent=m==='thinking'?'🧠 Thinking':'✍️ Writing';$('plus').classList.remove('open')};window.newChat=()=>{chat=[];$('msgs').innerHTML='<div class="welcome" id="welcome"><h1>What can I help with?</h1><p>Chat, files, image and video studio.</p></div>'};window.logout=()=>signOut(auth);window.upload=type=>{$('plus').classList.remove('open');$('file').accept=type==='photo'?'image/*':'.pdf,.doc,.docx,.txt,.csv,.xlsx';$('upload').classList.add('open')};window.closeUpload=()=>$('upload').classList.remove('open');window.useFile=()=>{if(!$('file').files[0])return;add('user','📎 '+$('file').files[0].name);closeUpload()};window.openStudio=()=>{$('plus').classList.remove('open');$('studio').classList.add('open')};window.closeStudio=()=>$('studio').classList.remove('open');window.generate=()=>{$('status').textContent='Generation request ready. Real text-to-video API will be connected next.'};window.voice=()=>{if(!('webkitSpeechRecognition'in window)){alert('Voice input unavailable');return}let r=new webkitSpeechRecognition();r.lang='bn-BD';r.start();r.onresult=e=>$('input').value=e.results[0][0].transcript};
</script></body></html>
